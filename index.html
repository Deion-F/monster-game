<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Card Battle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/dialog.css">
</head>
<body>
    <!-- Welcome Dialog -->
    <dialog id="welcome-dialog" class="modal-dialog">
        <div class="dialog-content">
            <h2>Welcome to Monster Card Battle</h2>
            <div class="welcome-form">
                <div class="input-group">
                    <label for="player-name">Your Name:</label>
                    <input type="text" id="player-name" name="player-name" maxlength="20" placeholder="Enter your name" value="Player" autocomplete="off" />
                </div>
            </div>
            <div class="dialog-buttons">
                <button id="start-game" class="dialog-button primary">Start Game</button>
                <button id="show-tutorial" class="dialog-button" onclick="openTutorialFromWelcome(event)">How to Play</button>
            </div>
        </div>
    </dialog>
    <div class="game-container">
        <h1 class="visually-hidden">Monster Card Battle</h1>
        <div class="game-board">
            <!-- Bot corner: health (top-left) -->
            <section class="crest-group bot-stats" aria-label="Bot status">
                <div class="crest">
                        <svg class="crest-ring" viewBox="0 0 132 132" aria-hidden="true">
                            <circle class="crest-dots" cx="66" cy="66" r="63"></circle>
                            <circle class="crest-track" cx="66" cy="66" r="54"></circle>
                            <circle id="bot-health-ring" class="crest-fill" cx="66" cy="66" r="54" transform="rotate(-90 66 66)"></circle>
                        </svg>
                        <div class="crest-value">
                            <span id="bot-health" class="health-value">40</span>
                            <span class="crest-max">/ 40 HP</span>
                        </div>
                </div>
                <div class="crest-label">
                    <span id="bot-name" class="player-name">Bot</span>
                    <span id="bot-sub" class="crest-sub">Plans a few turns ahead</span>
                </div>
            </section>

            <!-- Bot corner: face-down hand (top-right) -->
            <section class="bot-hand-corner" aria-label="Bot hand">
                <div id="bot-hand-fan" class="bot-hand-fan" aria-hidden="true"></div>
                <span id="bot-hand-count" class="count-badge bot-badge">5 cards</span>
            </section>

            <!-- Deck (left of the midline) -->
            <div class="pile-cell deck-cell">
                <button id="deck" class="pile" aria-label="Deck: view contents">
                    <span id="deck-stack" class="pile-stack" aria-hidden="true"></span>
                    <span class="pile-label">Deck <span id="deck-count" class="pile-count">54</span></span>
                </button>
            </div>

            <!-- Board -->
            <main class="board-panel">
                <div class="player-area bot-area">
                    <div class="trap-row">
                        <div class="trap-space" id="bot-trap-0" data-index="0"></div>
                        <div class="trap-space" id="bot-trap-1" data-index="1"></div>
                        <div class="trap-space" id="bot-trap-2" data-index="2"></div>
                    </div>
                    <div class="monster-row">
                        <div class="monster-space" id="bot-monster-0" data-index="0"></div>
                        <div class="monster-space" id="bot-monster-1" data-index="1"></div>
                        <div class="monster-space" id="bot-monster-2" data-index="2"></div>
                    </div>
                </div>

                <div class="center-area">
                    <div class="center-rule" aria-hidden="true"></div>
                    <div class="turn-tracker">
                        <div class="turn-caption" aria-live="polite">
                            <span id="turn-indicator">Turn 1</span>
                            <span aria-hidden="true">·</span>
                            <span id="phase-indicator">Your turn</span>
                        </div>
                        <ol id="phase-steps" class="phase-steps" aria-label="Turn phases">
                            <li data-phase="Draw">Draw</li>
                            <li data-phase="Setup">Setup</li>
                            <li data-phase="Battle">Battle</li>
                            <li data-phase="End">End</li>
                        </ol>
                    </div>
                    <div class="center-rule" aria-hidden="true"></div>
                </div>

                <div class="player-area player-area-human">
                    <div class="monster-row">
                        <div class="monster-space" id="player-monster-0" data-index="0"></div>
                        <div class="monster-space" id="player-monster-1" data-index="1"></div>
                        <div class="monster-space" id="player-monster-2" data-index="2"></div>
                    </div>
                    <div class="trap-row">
                        <div class="trap-space" id="player-trap-0" data-index="0"></div>
                        <div class="trap-space" id="player-trap-1" data-index="1"></div>
                        <div class="trap-space" id="player-trap-2" data-index="2"></div>
                    </div>
                </div>
            </main>

            <!-- Discard and Jokers (right of the midline) -->
            <div class="pile-cell discard-cell">
                <button id="discard-pile" class="pile" aria-label="Discard pile: view contents">
                    <span id="discard-stack" class="pile-stack" aria-hidden="true"></span>
                    <span class="pile-label">Discard <span id="discard-count" class="pile-count">0</span></span>
                </button>
                <div id="joker-pile" class="pile joker-pile" role="group" aria-label="Jokers played: 0 of 2">
                    <span id="joker-stack" class="pile-stack" aria-hidden="true"></span>
                    <span class="pile-label">Jokers <span id="joker-count" class="pile-count">0 / 2</span></span>
                </div>
            </div>

            <!-- Your hand: a fan in the bottom-left corner -->
            <section class="hand-corner" aria-label="Your hand">
                <span id="player-hand-count" class="count-badge">5 in hand</span>
                <div id="player-hand" class="player-hand"></div>
            </section>

            <!-- Your corner: hint, health and controls (bottom-right) -->
            <section class="player-corner" aria-label="Your status and controls">
                <!-- Choices made on the board (sacrifices, traps, upkeep...) are explained and confirmed here -->
                <section id="prompt-panel" class="prompt-panel" aria-live="polite" hidden></section>
                <p id="hint-line" class="hint-line" aria-live="polite"></p>
                <div class="crest-group player-stats">
                    <div class="crest-label">
                        <span id="player-name-label" class="player-name">You</span>
                        <span id="player-sub" class="crest-sub"></span>
                        <span id="player-low" class="low-tag" hidden>Low health</span>
                    </div>
                    <div class="crest">
                        <svg class="crest-ring" viewBox="0 0 132 132" aria-hidden="true">
                            <circle class="crest-dots" cx="66" cy="66" r="63"></circle>
                            <circle class="crest-track" cx="66" cy="66" r="54"></circle>
                            <circle id="player-health-ring" class="crest-fill" cx="66" cy="66" r="54" transform="rotate(-90 66 66)"></circle>
                        </svg>
                        <div class="crest-value">
                            <span id="player-health" class="health-value">40</span>
                            <span class="crest-max">/ 40 HP</span>
                        </div>
                    </div>
                </div>
                <div class="corner-controls">
                    <button id="log-btn" class="icon-button" aria-label="Battle log" aria-expanded="false" aria-controls="game-log">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
                        <span class="unread-dot" aria-hidden="true"></span>
                    </button>
                    <div class="menu-wrap">
                        <button id="menu-btn" class="icon-button" aria-label="Menu" aria-expanded="false" aria-controls="game-menu">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                        </button>
                        <div id="game-menu" class="game-menu" hidden>
                            <button id="help-button" class="menu-item">Rules</button>
                            <button id="new-game-btn" class="menu-item">New game</button>
                            <button id="concede-btn" class="menu-item danger">Concede</button>
                        </div>
                    </div>
                    <button id="end-phase-btn" class="action-button">
                        <span class="end-text">
                            <span id="end-phase-label">End Phase</span>
                            <span id="end-phase-sub" class="end-sub" hidden></span>
                        </span>
                        <kbd class="key-hint">Space</kbd>
                    </button>
                </div>
            </section>
        </div>

        <!-- Battle log drawer: opens over the left side -->
        <aside id="game-log" class="log-drawer" aria-labelledby="log-header" hidden>
            <div class="log-head">
                <h2 id="log-header">Battle log</h2>
                <button id="log-close" class="icon-button small" aria-label="Close battle log">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
            <ol id="log-content" class="log-content" aria-live="polite"></ol>
        </aside>

        <!-- Hover popups -->
        <div id="attack-preview" class="attack-preview" role="tooltip" hidden></div>
        <div id="card-zoom" class="card-zoom" aria-hidden="true" hidden></div>

        <!-- Pile viewers and the end of the match stay as dialogs; game choices are made on the board -->
        <div id="deck-list-dialog" class="dialog">
            <div class="dialog-content">
                <h2 id="deck-list-title">Deck</h2>
                <div id="deck-list" class="card-list"></div>
                <div class="dialog-buttons">
                    <button id="close-deck-list" class="dialog-button primary">Close</button>
                </div>
            </div>
        </div>

        <div id="discard-list-dialog" class="dialog">
            <div class="dialog-content">
                <h2 id="discard-list-title">Discard pile</h2>
                <p id="discard-list-note" class="card-list-note"></p>
                <div id="discard-list" class="card-list"></div>
                <div class="dialog-buttons">
                    <button id="close-discard-list" class="dialog-button primary">Close</button>
                </div>
            </div>
        </div>
        
        <div id="game-over-dialog" class="dialog">
            <div class="dialog-content">
                <h2 id="game-result">Game Over</h2>
                <p id="game-over-message"></p>
                <div class="dialog-buttons">
                    <button id="new-game" class="dialog-button primary">New Game</button>
                </div>
            </div>
        </div>

        <!-- Tutorial modal -->
        <dialog id="tutorial-dialog" class="modal-dialog">
            <div class="dialog-content">
                <button id="close-tutorial" class="tutorial-close" aria-label="Close">✕</button>
                <h2>Game Rules</h2>
                <div class="tutorial-content">
                    <div class="tutorial-navigation">
                        <button id="prev-tutorial" class="tutorial-nav-button" onclick="tutorialPrev()">&lt; Previous</button>
                        <span id="tutorial-page-indicator">Page 1/5</span>
                        <button id="next-tutorial" class="tutorial-nav-button" onclick="tutorialNext()">Next &gt;</button>
                    </div>
                    <div id="tutorial-pages">
                        <!-- Tutorial pages will be dynamically loaded -->
                    </div>
                    <div class="tutorial-footer">
                        <button id="back-to-welcome" class="dialog-button" onclick="backToWelcome()">Back to Welcome Screen</button>
                    </div>
                </div>
            </div>
        </dialog>
    </div>

        <!-- Welcome dialog, Start Game and How to Play are wired up in js/main.js -->
        <!-- Game scripts -->
        <script src="js/constants.js"></script>
        <script src="js/utils.js"></script>
        <script src="js/card.js"></script>
        <script src="js/deck.js"></script>
        <script src="js/player.js"></script>
        <script src="js/board.js"></script>
        <script src="js/fx.js"></script>
        <script src="js/ui.js"></script>
        <script src="js/bot.js"></script>
        <script src="js/game.js"></script>
        <script src="js/tutorial.js"></script>
        <script src="js/main.js"></script>
</body>
</html>
