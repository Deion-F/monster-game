<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redesign Test</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div style="padding: 20px; font-family: Roboto, sans-serif;">
        <h1>Material Design 3 Redesign Test</h1>
        <p>If you can see this with proper Material Design styling, the CSS is loading correctly!</p>
        
        <h2>Token Tests</h2>
        <div style="display: flex; gap: 16px; margin: 20px 0;">
            <div style="width: 100px; height: 100px; background: var(--md-primary); border-radius: 8px;"></div>
            <div style="width: 100px; height: 100px; background: var(--md-secondary); border-radius: 8px;"></div>
            <div style="width: 100px; height: 100px; background: var(--color-monster-normal); border-radius: 8px;"></div>
            <div style="width: 100px; height: 100px; background: var(--color-trap); border-radius: 8px;"></div>
        </div>
        
        <h2>Card Size Test</h2>
        <div class="card" style="margin: 20px 0;">
            <div class="card-name">Test Card</div>
            <div class="card-value">5</div>
            <div class="card-description">This is a test card</div>
        </div>
        
        <h2>Animation Test</h2>
        <button onclick="testAnimation()" class="action-button">Test Summon Animation</button>
        <div id="anim-test" class="card" style="margin: 20px 0; display: inline-block;">
            <div class="card-name">Animated Card</div>
            <div class="card-value">7</div>
        </div>
        
        <script>
            function testAnimation() {
                const card = document.getElementById('anim-test');
                card.classList.add('anim-summon');
                setTimeout(() => {
                    card.classList.remove('anim-summon');
                }, 400);
            }
        </script>
        
        <p><a href="index.html" style="color: var(--md-primary); font-weight: 500;">← Back to Game</a></p>
    </div>
</body>
</html>
